<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>패션 트렌드</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="logo" href="/"><strong>Fashion Balance <i>AI</i></strong><small>YOUR PERSONAL STYLE ATELIER</small></a><nav aria-label="주 메뉴"><a href="/" class="nav-home">오늘의 코디</a><a href="/wardrobe.html" class="nav-closet">내 옷장</a><a href="/trends.html" class="nav-trends active">패션 트렌드</a><a href="/admin.html" class="nav-admin">상품 등록</a></nav><span class="header-note">STYLE WITH INTENTION</span></header><main><section class="panel"><h2>시즌별 스타일 점수</h2><p class="muted">관리자가 입력한 예시 데이터이며 실시간 유행 조사 결과가 아닙니다.</p><div id="trends"></div></section></main><script>fetch('/api/trends').then(r=>r.json()).then(rows=>{const root=document.querySelector('#trends');rows.forEach(t=>{const p=document.createElement('p');p.textContent=`${t.year} ${t.season} · ${t.style_name} · 점수 ${t.score} · ${t.notes||''}`;root.append(p)});if(!rows.length)root.textContent='등록된 트렌드 없음'}).catch(()=>document.querySelector('#trends').textContent='데이터를 불러오지 못했습니다')</script></body></html>
