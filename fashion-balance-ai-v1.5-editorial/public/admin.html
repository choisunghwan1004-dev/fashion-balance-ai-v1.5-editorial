<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>의류 등록</title></head><body><header class="site-header"><a class="logo" href="/"><strong>Fashion Balance <i>AI</i></strong><small>YOUR PERSONAL STYLE ATELIER</small></a><nav aria-label="주 메뉴"><a href="/" class="nav-home">오늘의 코디</a><a href="/wardrobe.html" class="nav-closet">내 옷장</a><a href="/trends.html" class="nav-trends">패션 트렌드</a><a href="/admin.html" class="nav-admin active">상품 등록</a></nav><span class="header-note">STYLE WITH INTENTION</span></header><main><section class="panel"><p class="muted">학습용 V1 화면입니다. 로그인 인증이 없으므로 인터넷에 공개하지 마세요.</p><form id="f"><label>상품명<input name="name" required></label><label>종류<select name="category_id"><option value="1">모자</option><option value="2">스카프</option><option value="3">아우터</option><option value="4">상의</option><option value="5">하의</option><option value="6">신발</option><option value="7">가방</option><option value="8">벨트</option><option value="9">시계</option><option value="10">주얼리</option></select></label><label>색상<select name="color_id"><option value="1">베이지</option><option value="2">화이트</option><option value="3">네이비</option><option value="4">브라운</option><option value="5">블랙</option><option value="6">그레이</option></select></label><label>스타일<select name="style_id"><option value="1">스마트 캐주얼</option><option value="2">미니멀</option><option value="3">클래식</option><option value="4">스트리트</option></select></label><label>계절<select name="season"><option>사계절</option><option>봄</option><option>여름</option><option>가을</option><option>겨울</option></select></label><label>가격<input name="price" type="number" min="0" required></label><label>상품 사진 URL (선택)<input name="image_url" type="url"></label><label>쇼핑 URL (선택)<input name="shop_url" type="url"></label><button>등록</button></form><p id="msg"></p></section></main><script>document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();document.querySelector('#msg').textContent=r.ok?`등록 성공: ID ${result.id}`:result.error}catch(err){document.querySelector('#msg').textContent=err.message}})</script></body></html>
