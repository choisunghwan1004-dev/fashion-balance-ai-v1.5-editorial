<main><a href="/">← 메인으로</a><section class="panel"><h1>나만의 옷장 시작하기</h1><p>닉네임과 이메일만 입력하세요. 메일로 받은 링크에서 인증하면 자동 로그인됩니다.</p><form id="login"><label>닉네임<input name="nickname" autocomplete="nickname" maxlength="60" required></label><label>이메일<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button class="primary">인증 메일 받기</button></form><button id="verify" class="primary" hidden>이 기기에서 로그인 완료</button><p id="status" role="status"></p><h2>휴대폰에서 시작하기</h2><img id="qr" src="/api/auth/qr" alt="가입 페이지 QR코드"><p>휴대폰 카메라로 QR코드를 스캔하세요. QR 자체에는 개인 인증 정보가 없습니다.</p></section></main>
